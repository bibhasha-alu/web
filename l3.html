<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; }
        input { width: 300px; padding: 8px; margin-top: 5px; }
        button { padding: 10px 20px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; }
        .error { color: red; font-size: 0.8em; display: block; margin-top: 5px; }
        .success { color: green; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <h2>Registration Form</h2>
    <form id="registrationForm" onsubmit="return validateForm(event)">
        
        <div class="form-group">
            <label>Name:</label>
            <input type="text" id="name">
            <span id="nameError" class="error"></span>
        </div>

        <div class="form-group">
            <label>Email:</label>
            <input type="text" id="email">
            <span id="emailError" class="error"></span>
        </div>

        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="password">
            <span id="passwordError" class="error"></span>
        </div>

        <div class="form-group">
            <label>Phone Number:</label>
            <input type="text" id="phone">
            <span id="phoneError" class="error"></span>
        </div>

        <div class="form-group">
            <label>Date of Birth:</label>
            <input type="date" id="dob">
            <span id="dobError" class="error"></span>
        </div>

        <button type="submit">Register</button>
        <p id="finalMessage"></p>
    </form>

    <script>
        function validateForm(event) {
            event.preventDefault();

            var name = document.getElementById("name").value;
            var email = document.getElementById("email").value;
            var password = document.getElementById("password").value;
            var phone = document.getElementById("phone").value;
            var dob = document.getElementById("dob").value;

            var isValid = true;

            var errors = document.getElementsByClassName('error');
            for (var i = 0; i < errors.length; i++) {
                errors[i].innerHTML = "";
            }
            document.getElementById("finalMessage").innerHTML = "";

            // Allows alphabets and spaces, minimum 3 characters
            var nameRegex = /^[A-Za-z ]{3,}$/;
            if (!nameRegex.test(name)) {
                document.getElementById("nameError").innerHTML = "Name must be at least 3 characters (letters and spaces only).";
                isValid = false;
            }

            var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                document.getElementById("emailError").innerHTML = "Enter a valid email (username@domain.extension).";
                isValid = false;
            }

            var passRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
            if (!passRegex.test(password)) {
                document.getElementById("passwordError").innerHTML = "Password must be 8+ chars with uppercase, lowercase, number, and symbol.";
                isValid = false;
            }

            var phoneRegex = /^[0-9]{10}$/;
            if (!phoneRegex.test(phone)) {
                document.getElementById("phoneError").innerHTML = "Phone number must be exactly 10 digits.";
                isValid = false;
            }

            if (dob === "") {
                document.getElementById("dobError").innerHTML = "Please select your date of birth.";
                isValid = false;
            }

            if (isValid) {
                document.getElementById("finalMessage").className = "success";
                document.getElementById("finalMessage").innerHTML = "Registration Successful!";
            }

            return isValid;
        }
    </script>

</body>
</html>
